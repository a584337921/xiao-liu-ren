<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小六壬起卦</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Serif SC', 'SimSun', 'STSong', serif;
            background: #fff;
            color: #222;
            padding: 30px 20px;
            line-height: 1.6;
        }

        .container { max-width: 900px; margin: 0 auto; }

        header {
            text-align: center;
            padding: 20px 0 30px;
            border-bottom: 1px solid #ddd;
            margin-bottom: 30px;
        }
        header h1 { font-size: 28px; letter-spacing: 6px; }
        header p { font-size: 14px; color: #888; margin-top: 6px; }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 25px;
            background: #fff;
        }

        .card-title {
            font-size: 17px;
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
            letter-spacing: 3px;
        }

        .input-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .input-group { flex: 1; }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 5px;
        }

        .input-group select,
        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            background: #fff;
            color: #222;
            outline: none;
        }
        .input-group select:focus,
        .input-group input:focus {
            border-color: #666;
        }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }

        .btn {
            flex: 1;
            padding: 11px;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            background: #fff;
            color: #333;
            letter-spacing: 2px;
            transition: background 0.2s;
        }
        .btn-primary {
            background: #333;
            color: #fff;
            font-weight: bold;
        }
        .btn:hover { background: #f5f5f5; }
        .btn-primary:hover { background: #555; }

        /* 农历日期显示 */
        .lunar-date-display {
            text-align: center;
            padding: 12px 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fafafa;
            font-size: 15px;
            color: #333;
            letter-spacing: 1px;
        }
        .lunar-date-display .lunar-label {
            font-size: 12px;
            color: #888;
            margin-right: 4px;
        }

        /* 掌诀图 */
        .hand-diagram { text-align: center; }
        .hand-svg { max-width: 260px; margin: 0 auto; }

        .finger-segment {
            fill: #fafafa;
            stroke: #bbb;
            stroke-width: 2;
            transition: all 0.4s;
        }
        .finger-segment.active {
            fill: #e0e0e0;
            stroke: #333;
            stroke-width: 3;
        }

        .gong-label {
            font-size: 11px;
            fill: #999;
            text-anchor: middle;
        }
        .gong-label.active {
            fill: #222;
            font-weight: bold;
            font-size: 12px;
        }

        /* 推算过程 */
        .steps { display: flex; flex-direction: column; gap: 10px; }

        .step {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border: 1px solid #eee;
            border-radius: 6px;
            border-left: 3px solid #ddd;
            transition: all 0.4s;
        }
        .step.active {
            border-left-color: #333;
            background: #fafafa;
        }
        .step-num {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid #ccc;
            color: #999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
            transition: all 0.4s;
        }
        .step.active .step-num {
            background: #333;
            color: #fff;
            border-color: #333;
        }
        .step-content { flex: 1; }
        .step-title { font-size: 13px; color: #888; }
        .step-result { font-size: 15px; margin-top: 4px; }
        .step-result .gong-name { font-weight: bold; }

        /* 最终结果 */
        .final-result {
            text-align: center;
            padding: 25px 0 0;
            margin-top: 20px;
            border-top: 1px solid #eee;
            display: none;
        }
        .final-result.show { display: block; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .final-gong { font-size: 42px; letter-spacing: 10px; margin-bottom: 8px; }
        .final-tag {
            display: inline-block;
            padding: 4px 18px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .tag-ji  { background: #fff; color: #333; border: 1px solid #333; }
        .tag-ping { background: #fff; color: #888; border: 1px solid #ccc; }
        .tag-xiong { background: #fff; color: #666; border: 1px solid #999; }

        .final-meaning { font-size: 16px; margin-bottom: 6px; }
        .final-desc { font-size: 13px; color: #666; line-height: 1.8; }

        .question-note-display {
            font-size: 13px;
            color: #555;
            margin-bottom: 15px;
            padding: 10px 14px;
            border: 1px solid #eee;
            border-radius: 6px;
            border-left: 3px solid #333;
            text-align: left;
            background: #fafafa;
        }
        .question-note-display:empty { display: none; }

        .divination-result {
            margin-top: 18px;
            padding: 0;
            text-align: left;
        }
        .divination-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 20px;
            padding: 14px 16px;
            border: 1px solid #eee;
            border-radius: 6px;
            background: #fafafa;
            margin-bottom: 16px;
        }
        .detail-row {
            display: flex;
            gap: 8px;
            font-size: 14px;
        }
        .detail-label {
            color: #888;
            flex-shrink: 0;
        }
        .detail-value {
            color: #333;
            font-weight: bold;
        }
        .divination-block {
            padding: 14px 16px;
            border: 1px solid #eee;
            border-radius: 6px;
            background: #fafafa;
            margin-bottom: 12px;
            text-align: left;
        }
        .divination-block:last-child { margin-bottom: 0; }
        .divination-label {
            font-size: 12px;
            color: #555;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .divination-text { font-size: 15px; line-height: 1.8; }
        .verse-text {
            font-size: 14px;
            color: #555;
            font-style: italic;
            line-height: 2;
        }

        .formula-display {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            font-size: 13px;
            color: #999;
            border-top: 1px dashed #eee;
        }

        .current-time-display {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            margin-top: 10px;
        }

        /* 起卦方式切换 */
        .method-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
        }
        .method-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            cursor: pointer;
            background: #fff;
            color: #666;
            border: none;
            font-family: inherit;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .method-tab.active {
            background: #333;
            color: #fff;
        }
        .method-tab:not(.active):hover {
            background: #f5f5f5;
        }

        /* 三数输入 */
        .number-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }
        .number-input-group input {
            width: 70px;
            text-align: center;
            font-size: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
            outline: none;
        }
        .number-input-group input:focus {
            border-color: #666;
        }
        .number-separator {
            font-size: 18px;
            color: #999;
        }
        .number-labels {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 6px;
            font-size: 12px;
            color: #888;
        }

        .method-section {
            display: none;
        }
        .method-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .hint-text {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>小六壬起卦</h1>
            <p>以大安起正月，月上起日，日上起时</p>
        </header>

        <div class="main-grid">
            <div>
                <div class="card" style="margin-bottom: 25px;">
                    <div class="card-title">起卦信息</div>

                    <!-- 起卦方式切换 -->
                    <div class="method-tabs">
                        <button class="method-tab active" id="tabTime" onclick="switchMethod('time')">时间起卦</button>
                        <button class="method-tab" id="tabNumber" onclick="switchMethod('number')">三数起卦</button>
                    </div>

                    <!-- 时间起卦区域 -->
                    <div class="method-section active" id="sectionTime">
                        <!-- 公历日期输入 -->
                        <div class="input-row">
                            <div class="input-group">
                                <label>公历年份</label>
                                <select id="solarYear"></select>
                            </div>
                            <div class="input-group">
                                <label>公历月份</label>
                                <select id="solarMonth"></select>
                            </div>
                            <div class="input-group">
                                <label>公历日期</label>
                                <select id="solarDay"></select>
                            </div>
                        </div>

                        <!-- 农历日期显示 -->
                        <div class="lunar-date-display" id="lunarDateDisplay">
                            <span class="lunar-label">农历：</span>--
                        </div>
                    </div>

                    <!-- 三数起卦区域 -->
                    <div class="method-section" id="sectionNumber">
                        <div class="input-group" style="margin-bottom: 8px;">
                            <label>随机三位数（如：358）</label>
                            <div class="number-input-group">
                                <input type="number" id="numHundred" min="0" max="9" placeholder="0" oninput="limitDigit(this)">
                                <span class="number-separator">-</span>
                                <input type="number" id="numTen" min="0" max="9" placeholder="0" oninput="limitDigit(this)">
                                <span class="number-separator">-</span>
                                <input type="number" id="numOne" min="0" max="9" placeholder="0" oninput="limitDigit(this)">
                            </div>
                            <div class="number-labels">
                                <span>百位</span>
                                <span>十位</span>
                                <span>个位</span>
                            </div>
                        </div>
                        <div class="hint-text">心中默想三个数字，或看到的一组数字</div>
                    </div>

                    <div class="input-row" id="hourRow">
                        <div class="input-group">
                            <label>时辰</label>
                            <select id="hour"></select>
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="input-group">
                            <label>事类</label>
                            <select id="questionType">
                                <option value="general">一般占断</option>
                                <option value="wealth">求财</option>
                                <option value="lost">寻物</option>
                                <option value="person">寻人</option>
                                <option value="travel">出行</option>
                                <option value="sick">疾病</option>
                                <option value="marriage">婚姻</option>
                                <option value="lawsuit">官事</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label>问事备注</label>
                            <input type="text" id="questionNote" placeholder="例如：今天出门谈生意能不能成">
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-secondary" id="btnSecondary" onclick="useCurrentTime()">使用当前时间</button>
                        <button class="btn btn-primary" onclick="calculate()">起卦</button>
                    </div>
                    <div class="current-time-display" id="currentTimeDisplay"></div>
                </div>

                <div class="card">
                    <div class="card-title">掌诀图</div>
                    <div class="hand-diagram">
                        <svg class="hand-svg" viewBox="0 0 300 360">
                            <ellipse cx="150" cy="300" rx="85" ry="55" fill="#fafafa" stroke="#bbb" stroke-width="2"/>
                            <!-- 食指：下节大安，上节留连 -->
                            <rect id="seg-dayan" class="finger-segment" x="72" y="185" width="36" height="65" rx="18"/>
                            <rect id="seg-liulian" class="finger-segment" x="72" y="80" width="36" height="95" rx="18"/>
                            <!-- 中指：下节空亡，上节速喜 -->
                            <rect id="seg-kongwang" class="finger-segment" x="132" y="185" width="36" height="65" rx="18"/>
                            <rect id="seg-suxi" class="finger-segment" x="132" y="80" width="36" height="95" rx="18"/>
                            <!-- 无名指：下节小吉，上节赤口 -->
                            <rect id="seg-xiaoji" class="finger-segment" x="192" y="185" width="36" height="65" rx="18"/>
                            <rect id="seg-chikou" class="finger-segment" x="192" y="80" width="36" height="95" rx="18"/>

                            <text id="label-dayan" class="gong-label" x="90" y="228">大安</text>
                            <text id="label-liulian" class="gong-label" x="90" y="132">留连</text>
                            <text id="label-suxi" class="gong-label" x="150" y="132">速喜</text>
                            <text id="label-kongwang" class="gong-label" x="150" y="228">空亡</text>
                            <text id="label-chikou" class="gong-label" x="210" y="132">赤口</text>
                            <text id="label-xiaoji" class="gong-label" x="210" y="228">小吉</text>

                            <text x="90" y="65" fill="#bbb" font-size="11" text-anchor="middle">食指</text>
                            <text x="150" y="65" fill="#bbb" font-size="11" text-anchor="middle">中指</text>
                            <text x="210" y="65" fill="#bbb" font-size="11" text-anchor="middle">无名指</text>

                            <!-- 顺时针方向箭头 -->
                            <path d="M 90 160 A 60 60 0 1 1 210 160" fill="none" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,3"/>
                            <polygon points="210,155 218,160 210,165" fill="#ddd"/>
                        </svg>
                    </div>
                </div>
            </div>

            <div>
                <div class="card">
                    <div class="card-title">推算过程</div>
                    <div class="steps" id="steps">
                        <div class="step" id="step1">
                            <div class="step-num">1</div>
                            <div class="step-content">
                                <div class="step-title" id="step1Title">月起：从大安起正月</div>
                                <div class="step-result" id="step1Result">等待起卦...</div>
                            </div>
                        </div>
                        <div class="step" id="step2">
                            <div class="step-num">2</div>
                            <div class="step-content">
                                <div class="step-title" id="step2Title">日起：从月落宫起初一</div>
                                <div class="step-result" id="step2Result">等待起卦...</div>
                            </div>
                        </div>
                        <div class="step" id="step3">
                            <div class="step-num">3</div>
                            <div class="step-content">
                                <div class="step-title" id="step3Title">时起：从日落宫起子时</div>
                                <div class="step-result" id="step3Result">等待起卦...</div>
                            </div>
                        </div>
                    </div>

                    <div class="final-result" id="finalResult">
                        <div class="question-note-display" id="questionNoteDisplay"></div>
                        <div class="final-gong" id="finalGong">--</div>
                        <div id="finalTag"></div>
                        <div class="final-meaning" id="finalMeaning"></div>
                        <div class="final-desc" id="finalDesc"></div>
                        <div class="divination-result" id="divinationResult"></div>
                    </div>

                    <div class="formula-display" id="formulaDisplay" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        /*
         * ========================================
         *  公历 → 农历转换模块
         *  数据范围：1900-2100 年
         * ========================================
         *  数据编码（每个元素为一个农历年的信息）：
         *    bits 0-3   : 闰月月份（0=无闰月）
         *    bits 4-15  : 12个月的大小月标记（1=30天, 0=29天）
         *                  bit 4=正月, bit 5=二月, ..., bit 15=十二月
         *    bit 16     : 闰月天数（0=29天, 1=30天）
         *
         *  基准对齐：公历 1900-01-31 = 农历 1900-01-01
         * ========================================
         */
        const lunarInfo = [
            0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
            0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
            0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
            0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
            0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
            0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
            0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
            0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
            0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
            0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0,
            0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
            0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
            0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
            0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
            0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
            0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06aa0,0x1a6c4,0x0aae0,
            0x092e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,
            0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,
            0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,
            0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a4d0,0x0d150,0x0f252,
            0x0d520
        ];

        const tianGan = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
        const diZhi = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
        const lunarMonthNames = ['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','冬月','腊月'];
        const lunarDayNames = [
            '','初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
            '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
            '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'
        ];

        function solarYearDays(y) {
            return ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 366 : 365;
        }

        function solarMonthDays(y, m) {
            if (m === 2) return ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 29 : 28;
            return [31,0,31,30,31,30,31,31,30,31,30,31][m-1];
        }

        function leapMonth(y) {
            return lunarInfo[y - 1900] & 0xf;
        }

        function leapDays(y) {
            if (leapMonth(y)) return (lunarInfo[y - 1900] & 0x10000) ? 30 : 29;
            return 0;
        }

        function lunarMonthDays(y, m) {
            return (lunarInfo[y - 1900] & (0x10 << (m - 1))) ? 30 : 29;
        }

        function lunarYearDays(y) {
            let sum = 348;
            for (let i = 0x8000; i >= 0x10; i >>= 1) {
                sum += (lunarInfo[y - 1900] & i) ? 1 : 0;
            }
            return sum + leapDays(y);
        }

        function getYearName(ly) {
            return tianGan[(ly - 4) % 10] + diZhi[(ly - 4) % 12] + '年';
        }

        /**
         * 公历 → 农历 转换
         * @returns {{ year, month, day, isLeap } | null}
         */
        function solarToLunar(y, m, d) {
            if (y < 1900 || y > 2100) return null;

            // 计算目标日期距 1900-01-01 的天数
            let offset = 0;
            for (let i = 1900; i < y; i++) offset += solarYearDays(i);
            for (let i = 1; i < m; i++) offset += solarMonthDays(y, i);
            offset += d - 1;

            // 减去基准偏移（1900-01-31 = 农历 1900-01-01）
            offset -= 30;

            // 用农历年逐减
            let ly = 1900;
            let lyd = lunarYearDays(ly);
            while (offset >= lyd) {
                offset -= lyd;
                ly++;
                lyd = lunarYearDays(ly);
            }

            // 用农历月逐减
            let lm = 1;
            let isLeap = false;
            let leapM = leapMonth(ly);

            while (true) {
                let md = lunarMonthDays(ly, lm);
                if (offset < md) break;
                offset -= md;

                if (lm === leapM) {
                    let ld = leapDays(ly);
                    if (offset < ld) {
                        isLeap = true;
                        break;
                    }
                    offset -= ld;
                }
                lm++;
            }

            return { year: ly, month: lm, day: offset + 1, isLeap: isLeap };
        }

                    travel: '出行大凶，诸事不利，万不可行。出行不吉利，凶多不吉祥，宜取消行程。\n\n若必须出行，宜往北方求谋吉利，忌往东方和东南方。路途凶险，不建议出行。',
                    sick: '病人逢暗鬼，病情凶险，须急解禳。久病添祸殃，久患雪加霜，病情恶化。\n\n空亡加留连，病人准死亡，极为凶险。病在脾脏和腹部，需立即就医，并配合禳解。\n\n少病怕空亡，老病逢之更凶，不可掉以轻心。',
                    marriage: '事不成，必有破，空欢喜一场。婚姻难成，或成而复散。\n\n空亡加留连，婚姻两分张。空亡加速喜，婚姻有一定但需靠自己。\n\n空亡加小吉，婚姻有喜事但需防猜疑。婚事多波折，不宜强求。',
                    lawsuit: '官事有刑伤，必受其害，难以脱身。官事有刑伤，诉讼必败。\n\n空亡加赤口，办事官非有，官司缠身。不宜诉讼，必受其害，宜寻求和解或其他途径。\n\n万口都诽谤，小舟遭狂浪，处境艰难。'
                }
            }
        ];

        // 顺时针宫位对应 SVG 元素 id
        const gongSegments = ['dayan', 'liulian', 'suxi', 'chikou', 'xiaoji', 'kongwang'];

        const shiChen = [
            { name: '子', num: 1, time: '23:00-01:00' },
            { name: '丑', num: 2, time: '01:00-03:00' },
            { name: '寅', num: 3, time: '03:00-05:00' },
            { name: '卯', num: 4, time: '05:00-07:00' },
            { name: '辰', num: 5, time: '07:00-09:00' },
            { name: '巳', num: 6, time: '09:00-11:00' },
            { name: '午', num: 7, time: '11:00-13:00' },
            { name: '未', num: 8, time: '13:00-15:00' },
            { name: '申', num: 9, time: '15:00-17:00' },
            { name: '酉', num: 10, time: '17:00-19:00' },
            { name: '戌', num: 11, time: '19:00-21:00' },
            { name: '亥', num: 12, time: '21:00-23:00' }
        ];

        function initOptions() {
            // 公历年份（1900-2100）
            const yearSelect = document.getElementById('solarYear');
            const currentYear = new Date().getFullYear();
            for (let i = 1900; i <= 2100; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i + '年';
                if (i === currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            }

            // 公历月份
            const monthSelect = document.getElementById('solarMonth');
            for (let i = 1; i <= 12; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i + '月';
                monthSelect.appendChild(opt);
            }

            // 公历日期
            const daySelect = document.getElementById('solarDay');
            for (let i = 1; i <= 31; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i + '日';
                daySelect.appendChild(opt);
            }

            // 时辰
            const hourSelect = document.getElementById('hour');
            shiChen.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.num;
                opt.textContent = s.name + '时 (' + s.time + ')';
                hourSelect.appendChild(opt);
            });

            // 公历日期变化时自动更新农历显示
            yearSelect.addEventListener('change', updateLunarDisplay);
            monthSelect.addEventListener('change', updateLunarDisplay);
            daySelect.addEventListener('change', updateLunarDisplay);
        }

        function updateLunarDisplay() {
            const y = parseInt(document.getElementById('solarYear').value);
            const m = parseInt(document.getElementById('solarMonth').value);
            const d = parseInt(document.getElementById('solarDay').value);

            const el = document.getElementById('lunarDateDisplay');
            if (!y || !m || !d) {
                el.innerHTML = '<span class="lunar-label">农历：</span>--';
                return;
            }

            const lunar = solarToLunar(y, m, d);
            if (!lunar) {
                el.innerHTML = '<span class="lunar-label">农历：</span>转换失败（仅支持1900-2100年）';
                return;
            }

            const prefix = lunar.isLeap ? '闰' : '';
            let leapHint = '';
            if (lunar.isLeap) {
                if (lunar.day <= 15 && lunar.month > 1) {
                    leapHint = ' （起卦时上半月按前月' + lunarMonthNames[lunar.month - 2] + '计算）';
                } else if (lunar.day <= 15) {
                    leapHint = ' （起卦时上半月按前月腊月计算）';
                } else {
                    leapHint = ' （起卦时下半月按本月计算）';
                }
            }
            el.innerHTML = '<span class="lunar-label">农历：</span>' +
                getYearName(lunar.year) + ' ' + prefix + lunarMonthNames[lunar.month - 1] +
                lunarDayNames[lunar.day] +
                (leapHint ? '<span style="color:#888;font-size:11px;">' + leapHint + '</span>' : '');
        }

        let currentMethod = 'time';

        function switchMethod(method) {
            currentMethod = method;

            // 切换标签样式
            document.getElementById('tabTime').classList.toggle('active', method === 'time');
            document.getElementById('tabNumber').classList.toggle('active', method === 'number');

            // 切换显示区域
            document.getElementById('sectionTime').classList.toggle('active', method === 'time');
            document.getElementById('sectionNumber').classList.toggle('active', method === 'number');

            // 时辰只在时间起卦时显示
            document.getElementById('hourRow').style.display = method === 'time' ? '' : 'none';

            // 更新按钮文字
            document.getElementById('btnSecondary').textContent =
                method === 'time' ? '使用当前时间' : '随机三位数';

            // 更新步骤标题
            if (method === 'time') {
                document.getElementById('step1Title').textContent = '月起：从大安起正月';
                document.getElementById('step2Title').textContent = '日起：从月落宫起初一';
                document.getElementById('step3Title').textContent = '时起：从日落宫起子时';
            } else {
                document.getElementById('step1Title').textContent = '百位起：从大安起顺数';
                document.getElementById('step2Title').textContent = '十位起：从百位落宫起顺数';
                document.getElementById('step3Title').textContent = '个位起：从十位落宫起顺数';
            }

            // 清空之前的结果
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById('finalResult').classList.remove('show');
            document.getElementById('formulaDisplay').style.display = 'none';
            document.getElementById('step1Result').textContent = '等待起卦...';
            document.getElementById('step2Result').textContent = '等待起卦...';
            document.getElementById('step3Result').textContent = '等待起卦...';
            highlightGong(-1);
        }

        function limitDigit(input) {
            let v = input.value;
            if (v.length > 1) input.value = v.slice(-1);
            if (v < 0) input.value = 0;
            if (v > 9) input.value = 9;
        }

        function getCurrentShiChen() {
            const h = new Date().getHours();
            if (h >= 23 || h < 1) return 1;
            if (h < 3) return 2;
            if (h < 5) return 3;
            if (h < 7) return 4;
            if (h < 9) return 5;
            if (h < 11) return 6;
            if (h < 13) return 7;
            if (h < 15) return 8;
            if (h < 17) return 9;
            if (h < 19) return 10;
            if (h < 21) return 11;
            return 12;
        }

        function useCurrentTime() {
            if (currentMethod === 'number') {
                // 三数起卦模式：生成随机三位数
                const n1 = Math.floor(Math.random() * 10);
                const n2 = Math.floor(Math.random() * 10);
                const n3 = Math.floor(Math.random() * 10);
                document.getElementById('numHundred').value = n1;
                document.getElementById('numTen').value = n2;
                document.getElementById('numOne').value = n3;
                document.getElementById('currentTimeDisplay').textContent =
                    '随机三位数：' + n1 + ' - ' + n2 + ' - ' + n3;
                return;
            }

            const now = new Date();
            document.getElementById('solarYear').value = now.getFullYear();
            document.getElementById('solarMonth').value = now.getMonth() + 1;
            document.getElementById('solarDay').value = now.getDate();
            updateLunarDisplay();
            const sc = getCurrentShiChen();
            document.getElementById('hour').value = sc;
            const lunar = solarToLunar(now.getFullYear(), now.getMonth() + 1, now.getDate());
            let lunarStr = '';
            if (lunar) {
                const prefix = lunar.isLeap ? '闰' : '';
                lunarStr = ' | 农历：' + getYearName(lunar.year) + ' ' + prefix + lunarMonthNames[lunar.month - 1] + lunarDayNames[lunar.day];
            }
            document.getElementById('currentTimeDisplay').textContent =
                '当前公历：' + now.getFullYear() + '年' + (now.getMonth()+1) + '月' +
                now.getDate() + '日 ' + shiChen[sc-1].name + '时' + lunarStr;
        }

        function highlightGong(index) {
            document.querySelectorAll('.finger-segment').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.gong-label').forEach(el => el.classList.remove('active'));
            if (index >= 0 && index < 6) {
                document.getElementById('seg-' + gongSegments[index])?.classList.add('active');
                document.getElementById('label-' + gongSegments[index])?.classList.add('active');
            }
        }

        function getGongSequence(startIndex, steps) {
            const names = [];
            for (let i = 0; i < steps; i++) {
                names.push(liuGong[(startIndex + i) % 6].name);
            }
            return names;
        }

        function calculate() {
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById('finalResult').classList.remove('show');
            document.getElementById('formulaDisplay').style.display = 'none';

            let yueIndex, riIndex, shiIndex;
            let yueGong, riGong, shiGong;
            let formula;

            if (currentMethod === 'time') {
                // ===== 时间起卦 =====
                const sy = parseInt(document.getElementById('solarYear').value);
                const sm = parseInt(document.getElementById('solarMonth').value);
                const sd = parseInt(document.getElementById('solarDay').value);
                const shi = parseInt(document.getElementById('hour').value);

                if (!sy || !sm || !sd || !shi) {
                    alert('请完整填写公历日期和时辰');
                    return;
                }

                const lunar = solarToLunar(sy, sm, sd);
                if (!lunar) {
                    alert('农历转换失败，请检查日期范围（1900-2100年）');
                    return;
                }

                const yue = lunar.month;
                const ri = lunar.day;
                const scName = shiChen[shi - 1].name;

                // 闰月处理：上半月算前月，下半月算本月
                let leapNote = '';
                let effectiveMonth = yue;
                let displayMonthName = lunarMonthNames[yue-1];
                if (lunar.isLeap) {
                    if (ri <= 15) {
                        effectiveMonth = yue - 1;
                        displayMonthName = lunarMonthNames[effectiveMonth-1];
                        leapNote = '（闰月上半月，按前月' + displayMonthName + '计算）';
                    } else {
                        leapNote = '（闰月下半月，按本月' + displayMonthName + '计算）';
                    }
                }

                // Step 1: 月起
                yueIndex = (effectiveMonth - 1) % 6;
                yueGong = liuGong[yueIndex];
                const yueSeq = getGongSequence(0, effectiveMonth);

                setTimeout(() => {
                    document.getElementById('step1').classList.add('active');
                    document.getElementById('step1Result').innerHTML =
                        '从大安起正月，顺数至' + displayMonthName + '，经过：' +
                        yueSeq.join(' → ') + '<br>' +
                        '月落<span class="gong-name">' + yueGong.name + '</span>宫' +
                        (leapNote ? '<br><span style="color:#888;font-size:12px;">' + leapNote + '</span>' : '');
                    highlightGong(yueIndex);
                }, 100);

                // Step 2: 日起
                riIndex = (yueIndex + ri - 1) % 6;
                riGong = liuGong[riIndex];
                const riSeq = getGongSequence(yueIndex, Math.min(ri, 12));

                setTimeout(() => {
                    document.getElementById('step2').classList.add('active');
                    const riSeqStr = ri <= 12 ? riSeq.join(' → ') : riSeq.join(' → ') + ' ...';
                    document.getElementById('step2Result').innerHTML =
                        '从' + yueGong.name + '起初一，顺数至' + lunarDayNames[ri] +
                        (ri > 12 ? '（循环往复）' : '') + '：' + riSeqStr + '<br>' +
                        '日落<span class="gong-name">' + riGong.name + '</span>宫';
                    highlightGong(riIndex);
                }, 600);

                // Step 3: 时起
                shiIndex = (riIndex + shi - 1) % 6;
                shiGong = liuGong[shiIndex];
                const shiSeq = getGongSequence(riIndex, Math.min(shi, 12));

                setTimeout(() => {
                    document.getElementById('step3').classList.add('active');
                    const shiSeqStr = shi <= 12 ? shiSeq.join(' → ') : shiSeq.join(' → ') + ' ...';
                    document.getElementById('step3Result').innerHTML =
                        '从' + riGong.name + '起子时，顺数至' + scName + '时' +
                        (shi > 12 ? '（循环往复）' : '') + '：' + shiSeqStr + '<br>' +
                        '时落<span class="gong-name">' + shiGong.name + '</span>宫';
                    highlightGong(shiIndex);
                }, 1100);

                const prefix = lunar.isLeap ? '闰' : '';
                formula = '农历' + prefix + lunarMonthNames[yue-1] + lunarDayNames[ri] +
                    ' ' + scName + '时' + (leapNote ? ' ' + leapNote : '') + ' → ' + shiGong.name;

            } else {
                // ===== 三数起卦 =====
                const n1 = parseInt(document.getElementById('numHundred').value);
                const n2 = parseInt(document.getElementById('numTen').value);
                const n3 = parseInt(document.getElementById('numOne').value);

                if (isNaN(n1) || isNaN(n2) || isNaN(n3)) {
                    alert('请输入完整的三位数字（0-9）');
                    return;
                }

                // 0当作6处理（取满数），1-9直接使用
                const num1 = n1 === 0 ? 6 : n1;
                const num2 = n2 === 0 ? 6 : n2;
                const num3 = n3 === 0 ? 6 : n3;

                // Step 1: 百位数 — 从大安起顺数
                yueIndex = (num1 - 1) % 6;
                yueGong = liuGong[yueIndex];
                const seq1 = getGongSequence(0, Math.min(num1, 12));

                setTimeout(() => {
                    document.getElementById('step1').classList.add('active');
                    const seq1Str = num1 <= 12 ? seq1.join(' → ') : seq1.join(' → ') + ' ...';
                    document.getElementById('step1Result').innerHTML =
                        '从大安起，顺数' + num1 + '位' +
                        (num1 > 12 ? '（循环往复）' : '') + '：' + seq1Str + '<br>' +
                        '百位落<span class="gong-name">' + yueGong.name + '</span>宫';
                    highlightGong(yueIndex);
                }, 100);

                // Step 2: 十位数 — 从百位落宫起顺数
                riIndex = (yueIndex + num2 - 1) % 6;
                riGong = liuGong[riIndex];
                const seq2 = getGongSequence(yueIndex, Math.min(num2, 12));

                setTimeout(() => {
                    document.getElementById('step2').classList.add('active');
                    const seq2Str = num2 <= 12 ? seq2.join(' → ') : seq2.join(' → ') + ' ...';
                    document.getElementById('step2Result').innerHTML =
                        '从' + yueGong.name + '起，顺数' + num2 + '位' +
                        (num2 > 12 ? '（循环往复）' : '') + '：' + seq2Str + '<br>' +
                        '十位落<span class="gong-name">' + riGong.name + '</span>宫';
                    highlightGong(riIndex);
                }, 600);

                // Step 3: 个位数 — 从十位落宫起顺数
                shiIndex = (riIndex + num3 - 1) % 6;
                shiGong = liuGong[shiIndex];
                const seq3 = getGongSequence(riIndex, Math.min(num3, 12));

                setTimeout(() => {
                    document.getElementById('step3').classList.add('active');
                    const seq3Str = num3 <= 12 ? seq3.join(' → ') : seq3.join(' → ') + ' ...';
                    document.getElementById('step3Result').innerHTML =
                        '从' + riGong.name + '起，顺数' + num3 + '位' +
                        (num3 > 12 ? '（循环往复）' : '') + '：' + seq3Str + '<br>' +
                        '个位落<span class="gong-name">' + shiGong.name + '</span>宫';
                    highlightGong(shiIndex);
                }, 1100);

                formula = '三数 ' + n1 + '-' + n2 + '-' + n3 + ' → ' + shiGong.name;
            }

            // 最终结果（通用）
            setTimeout(() => {
                const qType = document.getElementById('questionType').value;
                const qNote = document.getElementById('questionNote').value.trim();
                const qTypeLabels = {
                    general: '一般占断', wealth: '求财', lost: '寻物', person: '寻人',
                    travel: '出行', sick: '疾病', marriage: '婚姻', lawsuit: '官事'
                };

                document.getElementById('finalResult').classList.add('show');

                const noteEl = document.getElementById('questionNoteDisplay');
                if (qNote) {
                    noteEl.textContent = '所问：' + qNote;
                    noteEl.style.display = 'block';
                } else {
                    noteEl.textContent = '';
                    noteEl.style.display = 'none';
                }

                document.getElementById('finalGong').textContent = shiGong.name;
                document.getElementById('finalTag').innerHTML =
                    '<span class="final-tag ' + shiGong.tagClass + '">' + shiGong.luck + '</span>';
                document.getElementById('finalMeaning').textContent = shiGong.meaning;
                document.getElementById('finalDesc').textContent = shiGong.base;

                // 构建详细解卦内容
                const divText = shiGong.divination[qType] || shiGong.divination.general;
                let detailHTML = '';

                // 六神信息
                detailHTML += '<div class="divination-detail">';
                detailHTML += '<div class="detail-row"><span class="detail-label">六神</span><span class="detail-value">' + shiGong.sixGod + '</span></div>';
                detailHTML += '<div class="detail-row"><span class="detail-label">五行</span><span class="detail-value">' + shiGong.element + '</span></div>';
                detailHTML += '<div class="detail-row"><span class="detail-label">方位</span><span class="detail-value">' + shiGong.direction + '</span></div>';
                detailHTML += '<div class="detail-row"><span class="detail-label">数字</span><span class="detail-value">' + shiGong.numbers + '</span></div>';
                detailHTML += '</div>';

                // 传统口诀
                detailHTML += '<div class="divination-block">';
                detailHTML += '<div class="divination-label">【传统口诀】</div>';
                detailHTML += '<div class="divination-text verse-text">' + shiGong.verse.replace(/\n/g, '<br>') + '</div>';
                detailHTML += '</div>';

                // 针对事类的详细断辞
                detailHTML += '<div class="divination-block">';
                detailHTML += '<div class="divination-label">【' + qTypeLabels[qType] + '】</div>';
                detailHTML += '<div class="divination-text">' + divText.replace(/\n/g, '<br>') + '</div>';
                detailHTML += '</div>';

                // 如果选的不是一般占断，也附上一般占断
                if (qType !== 'general') {
                    detailHTML += '<div class="divination-block">';
                    detailHTML += '<div class="divination-label">【一般占断参考】</div>';
                    detailHTML += '<div class="divination-text">' + shiGong.divination.general.replace(/\n/g, '<br>') + '</div>';
                    detailHTML += '</div>';
                }

                document.getElementById('divinationResult').innerHTML = detailHTML;

                document.getElementById('formulaDisplay').style.display = 'block';
                document.getElementById('formulaDisplay').textContent = formula;
            }, 1600);
        }

        window.onload = function() {
            initOptions();
            useCurrentTime();
        };
    </script>
</body>
</html>
